<h6>Property Binding</h6>
<i class="glyphicon" 
[class.glyphicon-star-empty]="!meuFavorito"
[class.glyphicon-star]="meuFavorito" (click)="meuFavorito = !meuFavorito">
</i>

<h6>ngClass</h6>
<i class="glyphicon" 
  [ngClass]="{
    'glyphicon-star-empty': !meuFavorito,
    'glyphicon-star': meuFavorito
  }"
  (click)="meuFavorito = !meuFavorito">
</i>
