<nav class="navbar navbar-expand-lg navbar-dark bg-dark">  
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse">
    <div class="navbar-nav">
      <a class="nav-link" [class.active]="abaSelecionada == 'home'" (click)="abaSelecionada = 'home'">Home</a>
      <a class="nav-link" [class.active]="abaSelecionada == 'features'" (click)="abaSelecionada = 'features'">Features</a>
      <a class="nav-link" [class.active]="abaSelecionada == 'pricing'" (click)="abaSelecionada = 'pricing'">Pricing</a>
      <a class="nav-link" [class.active]="abaSelecionada == 'about'" (click)="abaSelecionada = 'about'">About</a>
    </div>
  </div>
</nav>
<div class="container" [ngSwitch]="abaSelecionada">
  <p *ngSwitchCase="'features'">Aba Features Ativa</p>
  <p *ngSwitchCase="'pricing'">Aba Pricing Ativa</p>
  <p *ngSwitchCase="'about'">Aba About Ativa</p>
  <p *ngSwitchDefault>Aba Home Ativa</p>
</div>
<article class="exemplo-template">
  <h5>Removendo o * e utilizando o template</h5>
  <div class="container" [ngSwitch]="abaSelecionada">
    <template [ngSwitchCase]="'features'"><p>Aba Features Ativa</p></template>
    <template [ngSwitchCase]="'pricing'"><p>Aba Pricing Ativa</p></template>
    <template [ngSwitchCase]="'about'"><p>Aba About Ativa</p></template>
    <template [ngSwitchCase]="'home'" ngSwitchDefault><p>Aba Home Ativa</p></template>
  </div>
</article>
