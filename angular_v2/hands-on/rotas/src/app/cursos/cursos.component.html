<section class="lista-cursos">
  <div class="collection">
    <a class="collection-item" *ngFor="let curso of cursos"
    [routerLink]="['/curso', curso.id]"> {{ curso.nome }}</a>
  </div>
</section>
<section>
  <p>Página: {{ pagina }}</p>
  <button (click)="proximaPagina()">Próxima Página</button>
</section>
