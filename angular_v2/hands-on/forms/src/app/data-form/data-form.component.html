<form class="form-horizontal" [formGroup]="formulario" (ngSubmit)="onSubmit()">
  <div class="form-group" [ngClass]="aplicaCssErro('nome')">
    <div class="col-sm-12">
      <label for="nome" class="control-label">Nome</label>
    </div>
    <div class="col-sm-12">
      <input type="text" id="nome" class="form-control" placeholder="Nome" formControlName="nome">
      <app-campo-control-erro [mostrarErro]="verificaValidTouched('nome')" msgErro="Nome é obrigatório."></app-campo-control-erro>
      <!-- Se não tiver a lógica dentro do componente é possível obter as informações diretas dos controles do formulario -->
      <!-- <app-campo-control-erro [mostrarErro]="!formulario.controls['nome'].valid && formulario.controls['nome'].touched" msgErro="Nome é obrigatório."></app-campo-control-erro> -->
      <!-- <app-campo-control-erro [mostrarErro]="!formulario.get('nome').valid && formulario.get('nome').touched" msgErro="Nome é obrigatório."></app-campo-control-erro> -->
    </div>
  </div>
  
  <div class="form-group">
    <div class="col-sm-12" [ngClass]="aplicaCssErro('email')">
      <label for="email" class="control-label">E-mail</label>
    </div>
    <div class="col-sm-12">
      <input type="email" id="email" class="form-control" placeholder="nome@email.com" formControlName="email">
      <app-campo-control-erro [mostrarErro]="verificaValidTouched('email')" msgErro="E-mail é obrigatório."></app-campo-control-erro>
      <app-campo-control-erro [mostrarErro]="verificaEmailInvalido()" msgErro="Informe um e-mail válido."></app-campo-control-erro>
    </div>
  </div>

  <div formGroupName="endereco">
    <div class="form-group">
  
      <div class="col-md-3" [ngClass]="aplicaCssErro('endereco.cep')">
        <label for="cep" class="control-label">CEP</label>
        <input type="text" class="form-control" id="cep" formControlName="cep" (blur)="consultaCEP()">
        <!-- <app-campo-control-erro [mostrarErro]="formulario.get('endereco.cep').valid" msgErro="CEP é obrigatório."></app-campo-control-erro> -->
        <!-- <app-campo-control-erro [mostrarErro]="formulario.controls['endereco'].controls['cep'].valid" msgErro="CEP é obrigatório."></app-campo-control-erro> -->
        <app-campo-control-erro [mostrarErro]="verificaValidTouched('endereco.cep')" msgErro="CEP é obrigatório."></app-campo-control-erro>
      </div>
  
      <div class="col-md-3" [ngClass]="aplicaCssErro('endereco.numero')">
        <label for="numero" class="control-label">Número</label>
        <input type="text" class="form-control" id="numero" formControlName="numero">
        <app-campo-control-erro [mostrarErro]="verificaValidTouched('endereco.numero')" msgErro="Número é obrigatório."></app-campo-control-erro>
      </div>
  
      <div class="col-md-6">
        <label for="complemento" class="control-label">Complemento</label>
        <input type="text" class="form-control" id="complemento" formControlName="complemento">
      </div>
    </div>
  
    <div class="form-group" [ngClass]="aplicaCssErro('endereco.rua')">
  
      <div class="col-sm-12">
        <label for="rua" class="control-label">Rua</label>
      </div>
      <div class="col-sm-12">
        <input type="text" class="form-control" id="rua" placeholder="Rua" formControlName="rua" >
        <app-campo-control-erro [mostrarErro]="verificaValidTouched('endereco.rua')" msgErro="Rua é obrigatório (informe um cep válido)."></app-campo-control-erro>
      </div>
    </div>
  
    <div class="form-group">
  
      <div class="col-md-5" [ngClass]="aplicaCssErro('endereco.bairro')">
        <label for="bairro" class="control-label">Bairro</label>
        <input type="text" class="form-control" id="bairro" formControlName="bairro">
        <app-campo-control-erro [mostrarErro]="verificaValidTouched('endereco.bairro')" msgErro="Bairro é obrigatório (informe um cep válido)."></app-campo-control-erro>
      </div>
  
      <div class="col-md-4" [ngClass]="aplicaCssErro('endereco.cidade')">
        <label for="cidade" class="control-label">Cidade</label>
        <input type="text" class="form-control" id="cidade" formControlName="cidade">
        <app-campo-control-erro [mostrarErro]="verificaValidTouched('endereco.cidade')" msgErro="Cidade é obrigatório."></app-campo-control-erro>    
      </div>
  
      <div class="col-md-3" [ngClass]="aplicaCssErro('endereco.estado')">
        <label for="estado" class="control-label">estado</label>
        <input type="text" class="form-control" id="estado" formControlName="estado">
        <app-campo-control-erro [mostrarErro]="verificaValidTouched('endereco.estado')" msgErro="Estado é obrigatório."></app-campo-control-erro>    
      </div>
    </div>
  </div>

  <!-- <button type="submit" class="btn btn-primary" [disabled]="!formulario.valid">Submit</button> -->
  <button type="submit" class="btn btn-primary">Submit</button>
  <button class="btn" (click)="resetar()">Cancelar</button>  
  <app-form-debug [form]="formulario"></app-form-debug>
</form>
