<form class="form-horizontal" [formGroup]="formulario" (ngSubmit)="onSubmit()">
  <div class="form-group" [ngClass]="aplicaCssErro('nome')">
    <div class="col-sm-12">
      <label for="nome" class="control-label">Nome</label>
    </div>
    <div class="col-sm-12">
      <input type="text" id="nome" class="form-control" placeholder="Nome" formControlName="nome">
      <app-campo-control-erro [mostrarErro]="verificaValidTouched('nome')" msgErro="Nome é obrigatório."></app-campo-control-erro>
      <!-- Se não tiver a lógica dentro do componente é possível obter as informações diretas dos controles do formulario -->
      <!-- <app-campo-control-erro [mostrarErro]="!formulario.controls['nome'].valid && formulario.controls['nome'].touched" msgErro="Nome é obrigatório."></app-campo-control-erro> -->
      <!-- <app-campo-control-erro [mostrarErro]="!formulario.get('nome').valid && formulario.get('nome').touched" msgErro="Nome é obrigatório."></app-campo-control-erro> -->
    </div>
  </div>
  
  <div class="form-group">
    <div class="col-sm-12" [ngClass]="aplicaCssErro('email')">
      <label for="email" class="control-label">E-mail</label>
    </div>
    <div class="col-sm-12">
      <input type="email" id="email" class="form-control" placeholder="nome@email.com" formControlName="email">
      <app-campo-control-erro [mostrarErro]="verificaValidTouched('email')" msgErro="E-mail é obrigatório."></app-campo-control-erro>
      <app-campo-control-erro [mostrarErro]="verificaEmailInvalido()" msgErro="Informe um e-mail válido."></app-campo-control-erro>
    </div>
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>  
  <button class="btn" (click)="resetar()">Cancelar</button>  
  <app-form-debug [form]="formulario"></app-form-debug>
</form>
