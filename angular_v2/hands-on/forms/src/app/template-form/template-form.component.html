<form #f="ngForm" (ngSubmit)="onSubmit(f)">
  <div class="form-group">
    <label for="nome">Nome</label>
    <input type="text" id="nome" class="form-control" placeholder="Nome" [(ngModel)]="usuario.nome" name="nome">
  </div>
  
  <div class="form-group">
    <label for="email">E-mail</label>
    <input type="email" id="email" class="form-control" placeholder="nome@email.com" [(ngModel)]="usuario.email" name="email">
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>
